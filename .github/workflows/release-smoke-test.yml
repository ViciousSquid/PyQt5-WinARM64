name: ARM64 Release Smoke Test

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to test"
        required: true
        default: "v5.15.11"

permissions:
  contents: read

jobs:
  smoke-test:
    name: PyQt5 ARM64 release smoke test
    runs-on: windows-11-vs2026-arm

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out smoke test
        uses: actions/checkout@v5

      - name: Set up ARM64 CPython
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.16"
          architecture: arm64

      - name: Verify native ARM64 Python
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $pythonArch = python -c "import platform; print(platform.machine())"

          if ($arch -ne "Arm64") {
            throw "Runner is not native ARM64: $arch"
          }

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "PROCESSOR_ARCHITECTURE is not ARM64: $env:PROCESSOR_ARCHITECTURE"
          }

          if ($pythonArch -ne "ARM64") {
            throw "Python is not ARM64: $pythonArch"
          }

          if ([IntPtr]::Size -ne 8) {
            throw "Python is not 64-bit"
          }

          Write-Host "Native Windows ARM64 + ARM64 CPython verified."

      - name: Download release wheels
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path release-wheels | Out-Null

          gh release download "$env:RELEASE_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "pyqt5_winarm64-*.whl" `
            --pattern "pyqt5_sip_winarm64-*.whl" `
            --dir release-wheels `
            --clobber

          $pyqt = @(Get-ChildItem release-wheels -Filter "pyqt5_winarm64-*.whl")
          $sip = @(Get-ChildItem release-wheels -Filter "pyqt5_sip_winarm64-*.whl")

          if ($pyqt.Count -ne 1) {
            throw "Expected exactly one PyQt5-WinARM64 wheel, found $($pyqt.Count)"
          }

          if ($sip.Count -ne 1) {
            throw "Expected exactly one PyQt5-sip-WinARM64 wheel, found $($sip.Count)"
          }

          Write-Host "PyQt5 wheel: $($pyqt[0].Name)"
          Write-Host "SIP wheel:   $($sip[0].Name)"

      - name: Install exact release wheels
        shell: pwsh
        run: |
          python -m venv release-smoke-venv

          & ".\release-smoke-venv\Scripts\python.exe" `
            -m pip install `
            --no-index `
            --find-links (Resolve-Path release-wheels) `
            (Get-ChildItem release-wheels -Filter "pyqt5_sip_winarm64-*.whl").FullName `
            (Get-ChildItem release-wheels -Filter "pyqt5_winarm64-*.whl").FullName

      - name: Run PyQt5 ARM64 smoke application
        shell: pwsh
        run: |
          & ".\release-smoke-venv\Scripts\python.exe" tools\pyqt5_smoke.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyQt5-WinARM64 release smoke test failed"
          }
