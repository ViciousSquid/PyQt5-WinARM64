name: ARM64 Release Smoke Test

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to test, e.g. v5.15.11.post1"
        required: true
        default: "v5.15.11.post1"
      from_pypi:
        description: "Install from PyPI instead of the GitHub release assets"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke-test:
    name: Release smoke test (CPython ${{ matrix.python }})
    runs-on: windows-11-vs2026-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.16", "3.14.8"]

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      FROM_PYPI: ${{ inputs.from_pypi || false }}

    steps:
      - name: Check out smoke test
        uses: actions/checkout@v5

      - name: Set up ARM64 CPython
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64

      - name: Make sure no Qt installation is reachable
        shell: pwsh
        run: |
          foreach ($dir in $env:PATH.Split([IO.Path]::PathSeparator)) {
            if ($dir -and (Test-Path (Join-Path $dir "Qt5Core.dll"))) {
              throw "Qt5Core.dll is reachable on PATH via $dir"
            }
          }

      - name: Install release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv release-smoke-venv
          $py = ".\release-smoke-venv\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          $version = $env:RELEASE_TAG.TrimStart("v")
          if ($env:FROM_PYPI -eq "true") {
            # PyPI's CDN can serve a stale index for a few minutes after an
            # upload ("from versions: none"), so retry before failing.
            $installed = $false
            for ($attempt = 1; $attempt -le 6 -and -not $installed; $attempt++) {
              $PSNativeCommandUseErrorActionPreference = $false
              & $py -m pip install --no-cache-dir --only-binary=:all: "PyQt5-WinARM64==$version"
              $installed = ($LASTEXITCODE -eq 0)
              $PSNativeCommandUseErrorActionPreference = $true
              if (-not $installed -and $attempt -lt 6) {
                Write-Host "PyQt5-WinARM64==$version not installable yet (attempt $attempt); retrying in 30s"
                Start-Sleep -Seconds 30
              }
            }
            if (-not $installed) { throw "Could not install PyQt5-WinARM64==$version from PyPI" }
          } else {
            New-Item -ItemType Directory -Force -Path release-wheels | Out-Null
            gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" `
              --pattern "pyqt5_winarm64-*.whl" --pattern "pyqt5_sip_winarm64-*.whl" `
              --dir release-wheels --clobber
            & $py -m pip install --no-index --find-links (Resolve-Path release-wheels) "PyQt5-WinARM64==$version"
          }
          & $py -m pip check
          & $py -m pip list

      - name: Run PyQt5 ARM64 smoke application
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & ".\release-smoke-venv\Scripts\python.exe" tools\pyqt5_smoke.py
