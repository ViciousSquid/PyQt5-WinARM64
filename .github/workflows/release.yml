name: Publish PyQt5 Windows ARM64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release containing the validated wheels"
        required: true
        default: "v5.15.11.post1"

permissions:
  contents: read

# The job names, this file name and the environment names are what PyPI
# Trusted Publishing is configured against; keep them unchanged.
jobs:
  publish-pyqt5:
    name: Publish PyQt5-WinARM64
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out wheel checker
        uses: actions/checkout@v5

      - name: Download wheel from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "pyqt5_winarm64-*.whl" --dir publish
          ls -lh publish

      - name: Verify wheel before upload
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Refuses a wheel without the bundled Qt runtime, with a broken
          # .dist-info, or whose RECORD does not match its contents.
          python3 tools/verify_wheel.py publish/*.whl --expect-version "${RELEASE_TAG#v}"

      - name: Publish PyQt5-WinARM64 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish

  publish-sip:
    name: Publish PyQt5-sip-WinARM64
    runs-on: ubuntu-latest
    environment: pypi-sip
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out wheel checker
        uses: actions/checkout@v5

      - name: Download wheels from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "pyqt5_sip_winarm64-*.whl" --dir publish
          ls -lh publish

      - name: Verify wheels before upload
        run: |
          set -euo pipefail
          python3 tools/verify_wheel.py publish/*.whl

      - name: Publish PyQt5-sip-WinARM64 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish
