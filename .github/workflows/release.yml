name: Release PyQt5 Windows ARM64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release containing the validated wheels"
        required: true
        default: "v5.15.11"

permissions:
  contents: read

jobs:
  publish-pyqt5:
    name: Publish PyQt5-WinARM64
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheel from GitHub release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p publish
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/pyqt5_winarm64-5.15.11-cp38-abi3-win_arm64.whl" \
            -o publish/pyqt5_winarm64-5.15.11-cp38-abi3-win_arm64.whl
          python -m pip install --disable-pip-version-check --no-index --no-deps \
            publish/pyqt5_winarm64-5.15.11-cp38-abi3-win_arm64.whl
          ls -lh publish

      - name: Publish PyQt5-WinARM64 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish

  publish-sip:
    name: Publish PyQt5-sip-WinARM64
    runs-on: ubuntu-latest
    environment: pypi-sip
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheel from GitHub release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p publish
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/pyqt5_sip_winarm64-12.15.0-cp313-cp313-win_arm64.whl" \
            -o publish/pyqt5_sip_winarm64-12.15.0-cp313-cp313-win_arm64.whl
          python -m pip install --disable-pip-version-check --no-index --no-deps \
            publish/pyqt5_sip_winarm64-12.15.0-cp313-cp313-win_arm64.whl
          ls -lh publish

      - name: Publish PyQt5-sip-WinARM64 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish
