name: Release PyQt5 Windows ARM64

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    uses: ./.github/workflows/pyqt5-arm64.yml

  publish-pyqt5:
    name: Publish PyQt5-WinARM64
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download validated wheels
        uses: actions/download-artifact@v4
        with:
          name: pyqt5-win-arm64
          path: dist

      - name: Select PyQt5 distribution
        shell: bash
        run: |
          mkdir publish
          wheel="$(find dist -maxdepth 1 -type f -name 'PyQt5_WinARM64-*.whl' -print -quit)"
          test -n "$wheel"
          cp "$wheel" publish/
          ls -lh publish

      - name: Publish PyQt5-WinARM64
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish

  publish-sip:
    name: Publish PyQt5-sip-WinARM64
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-sip
    permissions:
      id-token: write
    steps:
      - name: Download validated wheels
        uses: actions/download-artifact@v4
        with:
          name: pyqt5-win-arm64
          path: dist

      - name: Select PyQt5-sip distribution
        shell: bash
        run: |
          mkdir publish
          wheel="$(find dist -maxdepth 1 -type f -name 'PyQt5_sip_WinARM64-*.whl' -print -quit)"
          test -n "$wheel"
          cp "$wheel" publish/
          ls -lh publish

      - name: Publish PyQt5-sip-WinARM64
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish
