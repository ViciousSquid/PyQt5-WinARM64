name: PyQt5 ARM64 wheel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  PYQT5_VERSION: "5.15.11"
  PYQT5_ARCHIVE: "PyQt5-5.15.11.tar.gz"
  PYQT5_SHA256: "fda45743ebb4a27b4b1a51c6d8ef455c4c1b5d610c90d2934c7802b5c1557c52"
  PYQT5_SIP_VERSION: "12.17.0"
  PYQT5_SIP_ARCHIVE: "pyqt5_sip-12.17.0.tar.gz"
  PYQT5_SIP_SHA256: "682dadcdbd2239af9fdc0c0628e2776b820e128bec88b49b8d692fe682f90b4f"
  SIP_VERSION: "6.10.0"
  PYQT_BUILDER_VERSION: "1.18.0"
  QT_VERSION: "5.15.19"
  QT_SHA256: "51e91c73abacab81e64efd01bf95794e79c0e605ad80947a024769f0dd620a32"
  WINFLEXBISON_VERSION: "2.5.25"

jobs:
  pyqt5-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Check runner architecture
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $proc = $env:PROCESSOR_ARCHITECTURE
          if ($arch -ne "Arm64" -or $proc -ne "ARM64") {
            throw "Expected native ARM64 Windows runner: RuntimeInformation=$arch PROCESSOR_ARCHITECTURE=$proc"
          }

      - name: Set up ARM64 CPython
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.16"
          architecture: arm64

      - name: Verify ARM64 CPython
        shell: pwsh
        run: |
          $arch = python -c "import platform; print(platform.machine())"
          if ($arch -ne "ARM64") { throw "Python is not ARM64: $arch" }
          if ([IntPtr]::Size -ne 8) { throw "Python pointer size is not 64-bit" }

      - name: Locate ARM64 MSVC toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $install) { throw "No Visual Studio installation with the ARM64 MSVC toolchain was found" }
          $vsdevcmd = Join-Path $install "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsdevcmd)) { throw "VsDevCmd.bat not found at $vsdevcmd" }
          "VSDEVCMD=$vsdevcmd" >> $env:GITHUB_ENV

      - name: Restore Qt ARM64 build
        uses: actions/cache@v4
        with:
          path: C:\Qt\${{ env.QT_VERSION }}\arm64
          key: qt-arm64-${{ env.QT_VERSION }}-${{ env.QT_SHA256 }}-${{ env.WINFLEXBISON_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true

      - name: Verify Qt ARM64 toolchain
        shell: pwsh
        run: |
          $qtRoot = "C:\Qt\$env:QT_VERSION\arm64"
          $qmake = Join-Path $qtRoot "bin\qmake.exe"
          if (-not (Test-Path $qmake)) { throw "Qt qmake not found: $qmake" }
          $env:PATH = "$(Split-Path $qmake);$env:PATH"
          "PATH=$(Split-Path $qmake);$env:PATH" >> $env:GITHUB_ENV
          & $qmake -query
          if ($LASTEXITCODE -ne 0) { throw "ARM64 qmake failed" }

      - name: Install pinned PyQt build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sip==$env:SIP_VERSION" "PyQt-builder==$env:PYQT_BUILDER_VERSION"
          $sip = python -m pip show sip | Select-String "^Version:" | ForEach-Object { $_.ToString().Split(":", 2)[1].Trim() }
          $builder = python -m pip show PyQt-builder | Select-String "^Version:" | ForEach-Object { $_.ToString().Split(":", 2)[1].Trim() }
          if ($sip -ne $env:SIP_VERSION) { throw "Unexpected SIP version: $sip" }
          if ($builder -ne $env:PYQT_BUILDER_VERSION) { throw "Unexpected PyQt-builder version: $builder" }

      - name: Download pinned PyQt5-sip source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://files.pythonhosted.org/packages/source/p/pyqt5-sip/$env:PYQT5_SIP_ARCHIVE" -OutFile $env:PYQT5_SIP_ARCHIVE
          $actual = (Get-FileHash $env:PYQT5_SIP_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PYQT5_SIP_SHA256) {
            throw "PyQt5-sip source SHA-256 mismatch: expected $env:PYQT5_SIP_SHA256, got $actual"
          }

      - name: Build PyQt5-sip ARM64 wheel
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --no-build-isolation $env:PYQT5_SIP_ARCHIVE --wheel-dir wheelhouse
          $wheel = Get-ChildItem wheelhouse -Filter "*.whl" | Where-Object { $_.Name -match "^PyQt5_sip-.*-cp313-cp313-win_arm64\.whl$" }
          if ($wheel.Count -ne 1) { throw "Expected exactly one ARM64 PyQt5-sip wheel, found $($wheel.Count)" }
          Write-Host "Built: $($wheel.Name)"

      - name: Install PyQt5-sip for binding build
        shell: pwsh
        run: |
          $wheel = Get-ChildItem wheelhouse -Filter "PyQt5_sip-*.whl"
          python -m pip install --no-deps $wheel.FullName

      - name: Download pinned PyQt5 source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://files.pythonhosted.org/packages/source/P/PyQt5/$env:PYQT5_ARCHIVE" -OutFile $env:PYQT5_ARCHIVE
          $actual = (Get-FileHash $env:PYQT5_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PYQT5_SHA256) {
            throw "PyQt5 source SHA-256 mismatch: expected $env:PYQT5_SHA256, got $actual"
          }
          Write-Host "PyQt5 source SHA-256: $actual"

      - name: Build PyQt5 ARM64 wheel
        shell: pwsh
        run: |
          # Build directly with SIP/PyQt-builder instead of pip's PEP 517
          # metadata phase. On the native ARM64 runner that metadata phase
          # exhausted Python memory after repeatedly invoking the Qt toolchain.
          $sourceDir = "PyQt5-$env:PYQT5_VERSION"
          tar -xzf $env:PYQT5_ARCHIVE
          if (-not (Test-Path "$sourceDir\pyproject.toml")) {
            throw "PyQt5 source tree was not extracted: $sourceDir"
          }
          Push-Location $sourceDir
          try {
            sip-wheel --qmake "C:\Qt\$env:QT_VERSION\arm64\bin\qmake.exe" --concatenate 8 --confirm-license
            $wheel = Get-ChildItem -File -Filter "PyQt5-*.whl"
            if ($wheel.Count -ne 1) { throw "Expected exactly one PyQt5 wheel, found $($wheel.Count)" }
            Move-Item $wheel.FullName (Join-Path $PWD "..\dist\$($wheel.Name)")
            Write-Host "Built: $($wheel.Name)"
          }
          finally {
            Pop-Location
          }
          $wheel = Get-ChildItem dist -Filter "PyQt5-*.whl"
          if ($wheel.Count -ne 1) { throw "Expected exactly one PyQt5 wheel in dist, found $($wheel.Count)" }
          if ($wheel.Name -notmatch "cp38-abi3-win_arm64\.whl$") {
            throw "Unexpected PyQt5 wheel tag: $($wheel.Name)"
          }

      - name: Bundle native Qt into PyQt5 wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter "PyQt5-*.whl"
          pyqt-bundle $wheel.FullName
          $bundled = Get-ChildItem dist -Filter "PyQt5-*.whl"
          if ($bundled.Count -ne 1) { throw "Expected exactly one bundled PyQt5 wheel, found $($bundled.Count)" }
          Write-Host "Bundled wheel: $($bundled.Name)"

      - name: Retag wheels for PyPI
        shell: pwsh
        run: |
          $pyqtWheel = Get-ChildItem dist -Filter "PyQt5-*.whl"
          $sipWheel = Get-ChildItem wheelhouse -Filter "PyQt5_sip-*.whl"
          python tools/retag_wheel.py $pyqtWheel.FullName --old-name PyQt5 --new-name PyQt5-WinARM64 --replace-requires PyQt5-sip PyQt5-sip-WinARM64
          python tools/retag_wheel.py $sipWheel.FullName --old-name PyQt5-sip --new-name PyQt5-sip-WinARM64
          Get-ChildItem dist -Filter "*.whl"
          Get-ChildItem wheelhouse -Filter "*.whl"

      - name: Verify wheel metadata
        shell: pwsh
        run: |
          python -m pip install --upgrade wheel
          python -c "import zipfile,glob; p=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(p); m=z.read(next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))).decode(); assert 'Name: PyQt5-WinARM64' in m; assert 'PyQt5-sip-WinARM64' in m; print(m)"
          python -c "import zipfile,glob; p=glob.glob('wheelhouse/*.whl')[0]; z=zipfile.ZipFile(p); m=z.read(next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))).decode(); assert 'Name: PyQt5-sip-WinARM64' in m; print(m)"

      - name: Verify wheel contents are ARM64
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter "PyQt5-*.whl"
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print('\n'.join(n for n in z.namelist() if n.lower().endswith(('.pyd','.dll'))))" $wheel.FullName
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); z.extractall('wheel-inspect')" $wheel.FullName
          $binaries = Get-ChildItem wheel-inspect -Recurse -File | Where-Object { $_.Extension -in ".pyd",".dll" }
          if (-not $binaries) { throw "No native binaries found in bundled wheel" }
          foreach ($binary in $binaries) {
            $command = 'call "' + $env:VSDEVCMD + '" -arch=arm64 && link /dump /headers "' + $binary.FullName + '"'
            $dump = cmd /c $command
            if ($LASTEXITCODE -ne 0) { throw "PE inspection failed for $($binary.Name)" }
            if (-not ($dump -join [Environment]::NewLine).Contains("AA64 machine (ARM64)")) {
              throw "$($binary.Name) is not an ARM64 PE image"
            }
          }
          Write-Host "All bundled native binaries are ARM64."

      - name: Clean ARM64 installation and QApplication smoke test
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter "PyQt5_WinARM64-*.whl"
          $sipWheel = Get-ChildItem wheelhouse -Filter "PyQt5_sip_WinARM64-*.whl"
          python -m venv smoke-venv
          & ".\smoke-venv\Scripts\python.exe" -m pip install --upgrade pip
          & ".\smoke-venv\Scripts\python.exe" -m pip install --no-index --find-links (Resolve-Path dist) --find-links (Resolve-Path wheelhouse) $sipWheel.FullName $wheel.FullName
          & ".\smoke-venv\Scripts\python.exe" -c "import platform; assert platform.machine() == 'ARM64'; from PyQt5.QtCore import QT_VERSION_STR; from PyQt5.QtWidgets import QApplication; app=QApplication([]); print('PyQt5', QT_VERSION_STR, 'QApplication OK')"
          if ($LASTEXITCODE -ne 0) { throw "ARM64 QApplication smoke test failed" }

      - name: Upload validated wheels
        uses: actions/upload-artifact@v4
        with:
          name: pyqt5-win-arm64
          path: |
            dist/PyQt5_WinARM64-*.whl
            wheelhouse/PyQt5_sip_WinARM64-*.whl
          if-no-files-found: error
