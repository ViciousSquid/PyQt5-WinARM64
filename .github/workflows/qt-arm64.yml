name: Qt ARM64 bootstrap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "5.15.19"
  QT_ARCHIVE: "qtbase-everywhere-opensource-src-5.15.19.tar.xz"
  QT_SHA256: "51e91c73abacab81e64efd01bf95794e79c0e605ad80947a024769f0dd620a32"
  QT_CONFIGURE_REV: "process-v2"
  WINFLEXBISON_VERSION: "2.5.25"
  WINFLEXBISON_ARCHIVE: "win_flex_bison-2.5.25.zip"
  WINFLEXBISON_SHA256: "8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135"

jobs:
  qtbase-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Check runner architecture
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $proc = $env:PROCESSOR_ARCHITECTURE
          if ($arch -ne "Arm64" -or $proc -ne "ARM64") {
            throw "Expected native ARM64 Windows runner: RuntimeInformation=$arch PROCESSOR_ARCHITECTURE=$proc"
          }

      - name: Set up ARM64 CPython
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.16"
          architecture: arm64

      - name: Verify ARM64 CPython
        shell: pwsh
        run: |
          $arch = python -c "import platform; print(platform.machine())"
          if ($arch -ne "ARM64") { throw "Python is not ARM64: $arch" }
          if ([IntPtr]::Size -ne 8) { throw "Python pointer size is not 64-bit" }

      - name: Locate ARM64 MSVC toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $install) { throw "No Visual Studio installation with the ARM64 MSVC toolchain was found" }
          $vsdevcmd = Join-Path $install "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsdevcmd)) { throw "VsDevCmd.bat not found at $vsdevcmd" }
          "VSDEVCMD=$vsdevcmd" >> $env:GITHUB_ENV
          Write-Host "Visual Studio: $install"

      - name: Install pinned Qt build tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/lexxmark/winflexbison/releases/download/v$env:WINFLEXBISON_VERSION/$env:WINFLEXBISON_ARCHIVE" -OutFile $env:WINFLEXBISON_ARCHIVE
          $actual = (Get-FileHash $env:WINFLEXBISON_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:WINFLEXBISON_SHA256) {
            throw "WinFlexBison SHA-256 mismatch: expected $env:WINFLEXBISON_SHA256, got $actual"
          }
          $tools = Join-Path $env:GITHUB_WORKSPACE "winflexbison"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Expand-Archive -Path $env:WINFLEXBISON_ARCHIVE -DestinationPath $tools -Force
          "WINFLEXBISON_HOME=$tools" >> $env:GITHUB_ENV
          $env:PATH = "$tools;$env:PATH"
          "PATH=$tools;$env:PATH" >> $env:GITHUB_ENV
          $flex = Get-Command flex -ErrorAction SilentlyContinue
          if (-not $flex) {
            $winFlex = Join-Path $tools "win_flex.exe"
            if (-not (Test-Path $winFlex)) { throw "win_flex.exe was not found after extraction" }
            Copy-Item $winFlex (Join-Path $tools "flex.exe")
          }
          $bison = Get-Command bison -ErrorAction SilentlyContinue
          if (-not $bison) {
            $winBison = Join-Path $tools "win_bison.exe"
            if (-not (Test-Path $winBison)) { throw "win_bison.exe was not found after extraction" }
            Copy-Item $winBison (Join-Path $tools "bison.exe")
          }
          flex --version
          bison --version

      - name: Download pinned Qt source
        shell: pwsh
        run: |
          $url = "https://download.qt.io/archive/qt/5.15/${env:QT_VERSION}/submodules/${env:QT_ARCHIVE}"
          Invoke-WebRequest -Uri $url -OutFile $env:QT_ARCHIVE
          $actual = (Get-FileHash $env:QT_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:QT_SHA256) {
            throw "Qt source SHA-256 mismatch: expected $env:QT_SHA256, got $actual"
          }
          Write-Host "Qt source SHA-256: $actual"

      - name: Extract Qt source
        shell: pwsh
        run: |
          tar -xf $env:QT_ARCHIVE
          $configure = @(Get-ChildItem -Path . -Filter "configure.bat" -Recurse -File)
          if ($configure.Count -ne 1) {
            throw "Expected exactly one Qt configure.bat after extraction, found $($configure.Count)"
          }
          $source = $configure[0].Directory.FullName
          Write-Host "Qt source: $source"
          "QT_SOURCE=$source" >> $env:GITHUB_ENV

      - name: Configure Qt for native ARM64
        shell: pwsh
        run: |
          $qtPrefix = "C:\Qt\$env:QT_VERSION\arm64"
          $command = '"' + $env:VSDEVCMD + '" -arch=arm64 && cd /d "' + $env:QT_SOURCE + '" && configure.bat -platform win32-msvc -release -opensource -confirm-license -prefix "' + $qtPrefix + '" -nomake tests -nomake examples -no-openssl -feature-processenvironment -feature-process'
          Write-Host "Qt install prefix: $qtPrefix"
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw "Qt configure failed" }

      - name: Restore Qt ARM64 build cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt\${{ env.QT_VERSION }}\arm64
          key: qt-arm64-${{ env.QT_VERSION }}-${{ env.QT_SHA256 }}-${{ env.QT_CONFIGURE_REV }}-${{ env.WINFLEXBISON_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build Qt base
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $command = '"' + $env:VSDEVCMD + '" -arch=arm64 && cd /d "' + $env:QT_SOURCE + '" && nmake'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw "Qt build failed" }

      - name: Install Qt base
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $command = '"' + $env:VSDEVCMD + '" -arch=arm64 && cd /d "' + $env:QT_SOURCE + '" && nmake install'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw "Qt install failed" }

      - name: Verify Qt binaries are ARM64
        shell: pwsh
        run: |
          $qtBin = "C:\Qt\$env:QT_VERSION\arm64\bin"
          $dlls = Get-ChildItem $qtBin -Filter "Qt5*.dll"
          if (-not $dlls) { throw "No installed Qt5 DLLs found in $qtBin" }

          foreach ($dll in $dlls) {
            $command = 'call "' + $env:VSDEVCMD + '" -arch=arm64 && link /dump /headers "' + $dll.FullName + '"'
            $dump = cmd /c $command
            if ($LASTEXITCODE -ne 0) { throw "PE inspection failed for $($dll.Name)" }
            if (-not ($dump -join [Environment]::NewLine).Contains("AA64 machine (ARM64)")) {
              throw "$($dll.Name) is not an ARM64 PE image"
            }
            Write-Host "$($dll.Name): ARM64"
          }

      - name: Verify Qt process configuration
        shell: pwsh
        run: |
          $qtRoot = "C:\Qt\$env:QT_VERSION\arm64"
          $qconfig = Get-ChildItem $qtRoot -Filter "qconfig.h" -Recurse -File | Select-Object -First 1
          if (-not $qconfig) { throw "Qt qconfig.h not found under $qtRoot" }
          $text = Get-Content $qconfig.FullName -Raw
          if ($text -notmatch '(?m)^#define QT_FEATURE_process 1\s*$') {
            throw "Qt process feature is not enabled in $($qconfig.FullName)"
          }
          if ($text -match '(?m)^#define QT_NO_PROCESS\s*$') {
            throw "Qt qconfig still defines QT_NO_PROCESS in $($qconfig.FullName)"
          }
          Write-Host "Qt process feature verified in $($qconfig.FullName)."

      - name: Verify Qt runtime
        shell: pwsh
        run: |
          $qtBin = "C:\Qt\$env:QT_VERSION\arm64\bin"
          & "$qtBin\qmake.exe" -query
          if ($LASTEXITCODE -ne 0) { throw "ARM64 qmake failed to execute" }
      - name: Verify Qt runtime
        shell: pwsh
        run: |
          $qtBin = "C:\Qt\$env:QT_VERSION\arm64\bin"
          & "$qtBin\qmake.exe" -query
          if ($LASTEXITCODE -ne 0) { throw "ARM64 qmake failed to execute" }

      - name: Verify Qt process feature
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "qt-process-probe"
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          @'
          QT += core
          CONFIG += console
          CONFIG -= app_bundle
          SOURCES += main.cpp
          '@ | Set-Content (Join-Path $probe "process.pro") -Encoding ascii
          @'
          #include <QCoreApplication>
          #ifdef QT_NO_PROCESS
          #error QT_NO_PROCESS is defined
          #endif
          #include <QProcess>
          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              QProcess process;
              return process.state() == QProcess::NotRunning ? 0 : 1;
          }
          '@ | Set-Content (Join-Path $probe "main.cpp") -Encoding ascii
          $command = 'call "' + $env:VSDEVCMD + '" -arch=arm64 && cd /d "' + $probe + '" && "' + "C:\Qt\$env:QT_VERSION\arm64\bin\qmake.exe" + '" process.pro && nmake'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw "Qt process feature probe failed" }
          Write-Host "Qt process feature is enabled."
